name: Deploy to EKS

on:
  push:
    branches:
      - main

permissions:
  id-token: write   # required for OIDC
  contents: write   # required for git push in update-manifests job

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Which autocare runtime components changed? (mono-repo selective deploy)
  # ─────────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      maintenance: ${{ steps.filter.outputs.maintenance }}
      ui: ${{ steps.filter.outputs.ui }}
      any_service: ${{ steps.filter.outputs.any_service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Paths filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'autocare/user-auth-service/**'
            maintenance:
              - 'autocare/vehicle-maintenance-service/**'
            ui:
              - 'autocare/vehicle-maintenance-ui/**'
            any_service:
              - 'autocare/user-auth-service/**'
              - 'autocare/vehicle-maintenance-service/**'
              - 'autocare/vehicle-maintenance-ui/**'

      - name: Report
        run: |
          echo "auth=${{ steps.filter.outputs.auth }} maintenance=${{ steps.filter.outputs.maintenance }} ui=${{ steps.filter.outputs.ui }} any_service=${{ steps.filter.outputs.any_service }}"

  # ─────────────────────────────────────────────────────────────────
  # Job 1 — Test only affected services (skipped if nothing under autocare/*/ changed)
  # ─────────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.any_service == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        if: needs.detect-changes.outputs.auth == 'true' || needs.detect-changes.outputs.maintenance == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Test user-auth-service
        if: needs.detect-changes.outputs.auth == 'true'
        working-directory: autocare/user-auth-service
        run: ./mvnw test -B

      - name: Test vehicle-maintenance-service
        if: needs.detect-changes.outputs.maintenance == 'true'
        working-directory: autocare/vehicle-maintenance-service
        run: ./mvnw test -B

      - name: Set up Node 20
        if: needs.detect-changes.outputs.ui == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: autocare/vehicle-maintenance-ui/package-lock.json

      - name: Test vehicle-maintenance-ui
        if: needs.detect-changes.outputs.ui == 'true'
        working-directory: autocare/vehicle-maintenance-ui
        run: |
          npm ci
          npm run test

  # ─────────────────────────────────────────────────────────────────
  # Job 2 — Build & push Docker images only for components that changed
  # ─────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: [detect-changes, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push user-auth-service
        if: needs.detect-changes.outputs.auth == 'true'
        run: |
          docker build \
            -t ${{ secrets.ECR_REGISTRY }}/autocare/user-auth-service:${{ github.sha }} \
            autocare/user-auth-service/
          docker push ${{ secrets.ECR_REGISTRY }}/autocare/user-auth-service:${{ github.sha }}

      - name: Build and push vehicle-maintenance-service
        if: needs.detect-changes.outputs.maintenance == 'true'
        run: |
          docker build \
            -t ${{ secrets.ECR_REGISTRY }}/autocare/vehicle-maintenance-service:${{ github.sha }} \
            autocare/vehicle-maintenance-service/
          docker push ${{ secrets.ECR_REGISTRY }}/autocare/vehicle-maintenance-service:${{ github.sha }}

      - name: Build and push vehicle-maintenance-ui
        if: needs.detect-changes.outputs.ui == 'true'
        run: |
          docker build \
            --build-arg VITE_AUTH_API_URL=${{ secrets.VITE_AUTH_API_URL }} \
            --build-arg VITE_MAINTENANCE_API_URL=${{ secrets.VITE_MAINTENANCE_API_URL }} \
            -t ${{ secrets.ECR_REGISTRY }}/autocare/vehicle-maintenance-ui:${{ github.sha }} \
            autocare/vehicle-maintenance-ui/
          docker push ${{ secrets.ECR_REGISTRY }}/autocare/vehicle-maintenance-ui:${{ github.sha }}

  # ─────────────────────────────────────────────────────────────────
  # Job 3 — Bump deployment YAML tags only for images that were rebuilt
  # ─────────────────────────────────────────────────────────────────
  update-manifests:
    name: Update Manifest Image Tags
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-push]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Update image tags (selective)
        env:
          SHA: ${{ github.sha }}
          ECR: ${{ secrets.ECR_REGISTRY }}
          CHANGED_AUTH: ${{ needs.detect-changes.outputs.auth }}
          CHANGED_MAINT: ${{ needs.detect-changes.outputs.maintenance }}
          CHANGED_UI: ${{ needs.detect-changes.outputs.ui }}
        run: |
          set -euo pipefail
          if [ "$CHANGED_AUTH" = "true" ]; then
            echo "Updating user-auth-service manifest tag -> ${SHA}"
            sed -i "s|image: .*autocare/user-auth-service:.*|image: ${ECR}/autocare/user-auth-service:${SHA}|g" \
              autocare-infra/k8s/deployments/user-auth-service.yaml
          fi
          if [ "$CHANGED_MAINT" = "true" ]; then
            echo "Updating vehicle-maintenance-service manifest tag -> ${SHA}"
            sed -i "s|image: .*autocare/vehicle-maintenance-service:.*|image: ${ECR}/autocare/vehicle-maintenance-service:${SHA}|g" \
              autocare-infra/k8s/deployments/vehicle-maintenance-service.yaml
          fi
          if [ "$CHANGED_UI" = "true" ]; then
            echo "Updating vehicle-maintenance-ui manifest tag -> ${SHA}"
            sed -i "s|image: .*autocare/vehicle-maintenance-ui:.*|image: ${ECR}/autocare/vehicle-maintenance-ui:${SHA}|g" \
              autocare-infra/k8s/deployments/vehicle-maintenance-ui.yaml
          fi

      - name: Commit and push updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add autocare-infra/k8s/deployments/
          git diff --staged --quiet && echo "No manifest changes to commit" && exit 0
          git commit -m "chore: update image tags to ${{ github.sha }} [skip ci]"
          git push
