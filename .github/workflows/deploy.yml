name: Deploy to EKS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_all_services:
        description: Build, push, and bump manifests for all three services (use after API path / contract changes)
        required: false
        default: false
        type: boolean

permissions:
  id-token: write   # required for OIDC
  contents: write   # required for git push in update-manifests job

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Which autocare runtime components changed? (mono-repo selective deploy)
  # ─────────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.resolve.outputs.auth }}
      maintenance: ${{ steps.resolve.outputs.maintenance }}
      ui: ${{ steps.resolve.outputs.ui }}
      any_service: ${{ steps.resolve.outputs.any_service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Paths filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'autocare/user-auth-service/**'
            maintenance:
              - 'autocare/vehicle-maintenance-service/**'
            ui:
              - 'autocare/vehicle-maintenance-ui/**'
            any_service:
              - 'autocare/user-auth-service/**'
              - 'autocare/vehicle-maintenance-service/**'
              - 'autocare/vehicle-maintenance-ui/**'

      - name: Resolve deploy scope (paths or manual full deploy)
        id: resolve
        shell: bash
        run: |
          # Manual "Deploy to EKS" with deploy_all_services bypasses path filtering so
          # all backends + UI roll together (needed when only one folder changed in Git
          # but every pod must pick up a shared API contract, e.g. /api/auth/version).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.deploy_all_services }}" = "true" ]; then
            echo "auth=true" >> "$GITHUB_OUTPUT"
            echo "maintenance=true" >> "$GITHUB_OUTPUT"
            echo "ui=true" >> "$GITHUB_OUTPUT"
            echo "any_service=true" >> "$GITHUB_OUTPUT"
            echo "Resolved: full deploy (manual override)"
          else
            echo "auth=${{ steps.filter.outputs.auth }}" >> "$GITHUB_OUTPUT"
            echo "maintenance=${{ steps.filter.outputs.maintenance }}" >> "$GITHUB_OUTPUT"
            echo "ui=${{ steps.filter.outputs.ui }}" >> "$GITHUB_OUTPUT"
            echo "any_service=${{ steps.filter.outputs.any_service }}" >> "$GITHUB_OUTPUT"
            echo "Resolved: path filter"
          fi

      - name: Report
        run: |
          echo "auth=${{ steps.resolve.outputs.auth }} maintenance=${{ steps.resolve.outputs.maintenance }} ui=${{ steps.resolve.outputs.ui }} any_service=${{ steps.resolve.outputs.any_service }}"

  # ─────────────────────────────────────────────────────────────────
  # Job 1 — Test only affected services (skipped if nothing under autocare/*/ changed)
  # ─────────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.any_service == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        if: needs.detect-changes.outputs.auth == 'true' || needs.detect-changes.outputs.maintenance == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Test user-auth-service
        if: needs.detect-changes.outputs.auth == 'true'
        working-directory: autocare/user-auth-service
        run: ./mvnw test -B

      - name: Test vehicle-maintenance-service
        if: needs.detect-changes.outputs.maintenance == 'true'
        working-directory: autocare/vehicle-maintenance-service
        run: ./mvnw test -B

      - name: Set up Node 20
        if: needs.detect-changes.outputs.ui == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: autocare/vehicle-maintenance-ui/package-lock.json

      - name: Test vehicle-maintenance-ui
        if: needs.detect-changes.outputs.ui == 'true'
        working-directory: autocare/vehicle-maintenance-ui
        run: |
          npm ci
          npm run test

  # ─────────────────────────────────────────────────────────────────
  # Job 2 — Build & push Docker images only for components that changed
  # ─────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: [detect-changes, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push user-auth-service
        if: needs.detect-changes.outputs.auth == 'true'
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          GIT_SHA: ${{ github.sha }}
        run: |
          BUILD_TIME="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          docker build \
            --build-arg "AUTOCARE_GIT_COMMIT=${GIT_SHA}" \
            --build-arg "AUTOCARE_BUILD_TIME=${BUILD_TIME}" \
            -t "${ECR_REGISTRY}/autocare/user-auth-service:${GIT_SHA}" \
            autocare/user-auth-service/
          docker push "${ECR_REGISTRY}/autocare/user-auth-service:${GIT_SHA}"

      - name: Build and push vehicle-maintenance-service
        if: needs.detect-changes.outputs.maintenance == 'true'
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          GIT_SHA: ${{ github.sha }}
        run: |
          BUILD_TIME="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          docker build \
            --build-arg "AUTOCARE_GIT_COMMIT=${GIT_SHA}" \
            --build-arg "AUTOCARE_BUILD_TIME=${BUILD_TIME}" \
            -t "${ECR_REGISTRY}/autocare/vehicle-maintenance-service:${GIT_SHA}" \
            autocare/vehicle-maintenance-service/
          docker push "${ECR_REGISTRY}/autocare/vehicle-maintenance-service:${GIT_SHA}"

      - name: Build and push vehicle-maintenance-ui
        if: needs.detect-changes.outputs.ui == 'true'
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          GIT_SHA: ${{ github.sha }}
          VITE_AUTH_API_URL: ${{ secrets.VITE_AUTH_API_URL }}
          VITE_MAINTENANCE_API_URL: ${{ secrets.VITE_MAINTENANCE_API_URL }}
        run: |
          BUILD_TIME="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          docker build \
            --build-arg "VITE_AUTH_API_URL=${VITE_AUTH_API_URL}" \
            --build-arg "VITE_MAINTENANCE_API_URL=${VITE_MAINTENANCE_API_URL}" \
            --build-arg "VITE_BUILD_TIME=${BUILD_TIME}" \
            -t "${ECR_REGISTRY}/autocare/vehicle-maintenance-ui:${GIT_SHA}" \
            autocare/vehicle-maintenance-ui/
          docker push "${ECR_REGISTRY}/autocare/vehicle-maintenance-ui:${GIT_SHA}"

  # ─────────────────────────────────────────────────────────────────
  # Job 3 — Bump deployment YAML tags only for images that were rebuilt
  # ─────────────────────────────────────────────────────────────────
  update-manifests:
    name: Update Manifest Image Tags
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-push]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Update image tags (selective)
        env:
          SHA: ${{ github.sha }}
          ECR: ${{ secrets.ECR_REGISTRY }}
          CHANGED_AUTH: ${{ needs.detect-changes.outputs.auth }}
          CHANGED_MAINT: ${{ needs.detect-changes.outputs.maintenance }}
          CHANGED_UI: ${{ needs.detect-changes.outputs.ui }}
        run: |
          set -euo pipefail
          if [ "$CHANGED_AUTH" = "true" ]; then
            echo "Updating user-auth-service manifest tag -> ${SHA}"
            sed -i "s|image: .*autocare/user-auth-service:.*|image: ${ECR}/autocare/user-auth-service:${SHA}|g" \
              autocare-infra/k8s/deployments/user-auth-service.yaml
          fi
          if [ "$CHANGED_MAINT" = "true" ]; then
            echo "Updating vehicle-maintenance-service manifest tag -> ${SHA}"
            sed -i "s|image: .*autocare/vehicle-maintenance-service:.*|image: ${ECR}/autocare/vehicle-maintenance-service:${SHA}|g" \
              autocare-infra/k8s/deployments/vehicle-maintenance-service.yaml
          fi
          if [ "$CHANGED_UI" = "true" ]; then
            echo "Updating vehicle-maintenance-ui manifest tag -> ${SHA}"
            sed -i "s|image: .*autocare/vehicle-maintenance-ui:.*|image: ${ECR}/autocare/vehicle-maintenance-ui:${SHA}|g" \
              autocare-infra/k8s/deployments/vehicle-maintenance-ui.yaml
          fi

      - name: Commit and push updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add autocare-infra/k8s/deployments/
          git diff --staged --quiet && echo "No manifest changes to commit" && exit 0
          git commit -m "chore: update image tags to ${{ github.sha }} [skip ci]"
          git push

  # ─────────────────────────────────────────────────────────────────
  # Retention: GitHub has no per-workflow YAML knob for run logs/artifacts.
  # Delete completed runs of *this* workflow older than 1 day (via API).
  # Runs after path detection only so it still executes when test/build are skipped.
  # ─────────────────────────────────────────────────────────────────
  prune-old-workflow-runs:
    name: Prune workflow runs older than 1 hour
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: always()
    permissions:
      actions: write
      contents: read

    steps:
      - name: Delete stale Deploy workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const workflow_id = 'deploy.yml';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRunId = context.runId;
            const cutoffMs = Date.now() - 1 * 60 * 60 * 1000;
            let page = 1;
            let deleted = 0;
            const maxPages = 50;

            while (page <= maxPages) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id,
                per_page: 100,
                page,
              });
              const runs = data.workflow_runs || [];
              if (runs.length === 0) break;

              for (const run of runs) {
                if (run.id === currentRunId) continue;
                const created = new Date(run.created_at).getTime();
                if (created >= cutoffMs) continue;
                if (run.status !== 'completed') continue;
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id,
                });
                deleted++;
              }

              if (runs.length < 100) break;
              page++;
            }

            core.info(`Pruned ${deleted} completed workflow run(s) older than 1 day (excluding current ${currentRunId}).`);
