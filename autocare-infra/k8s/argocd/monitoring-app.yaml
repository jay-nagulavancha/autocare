apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 88.3.0
    helm:
      releaseName: monitoring
      values: |
        # prometheus-operator's CRDs (Prometheus, Alertmanager, etc.) exceed the
        # 262144-byte metadata.annotations cap when ArgoCD applies them — happens with
        # or without ServerSideApply=true (ArgoCD keeps retrying its own reconcile of
        # them and hitting the same limit). Installed directly via a one-time
        # `kubectl apply --server-side` instead; disable the chart's own CRD management
        # so ArgoCD doesn't fight over them.
        crds:
          enabled: false

        # Prometheus runs in Agent mode — scrapes and remote-writes to AMP only,
        # no local TSDB/query, so no PersistentVolume (and no EBS CSI driver) is needed.
        prometheus:
          serviceAccount:
            create: true
            name: amp-ingest
            annotations:
              # Must match: terraform output -raw amp_ingest_role_arn
              eks.amazonaws.com/role-arn: arn:aws:iam::626635446574:role/jn-eks-amp-ingest
          prometheusSpec:
            agentMode: true
            remoteWrite:
              # Must match: terraform output -raw amp_remote_write_endpoint
              - url: https://aps-workspaces.us-west-2.amazonaws.com/workspaces/ws-1e1cbec8-5175-4312-a5fe-d79116bfaac5/api/v1/remote_write
                sigv4:
                  region: us-west-2
            storageSpec: {}
            resources:
              # 256Mi limit OOMKilled Prometheus (exit 137) — cluster-wide scraping
              # (apiserver, kubelet, etcd, kube-state-metrics, 5x node-exporter) plus
              # the remote-write WAL buffer needs more headroom even in agent mode.
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                cpu: 300m
                memory: 512Mi

        # No AlertManager — not requested, saves a pod on an already-tight t3.small budget.
        alertmanager:
          enabled: false

        prometheusOperator:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi

        grafana:
          # Required for the "grafana-amazonprometheus-datasource" datasource type below —
          # it's not bundled in the base image, grafana-cli installs it at pod startup.
          plugins:
            - grafana-amazonprometheus-datasource
          grafana.ini:
            auth:
              # Grafana won't SigV4-sign requests to any datasource unless this is
              # enabled server-wide (per-datasource sigV4Auth:true alone isn't enough) —
              # without it Grafana sends unsigned requests, which AMP rejects with
              # "Missing Authentication Token".
              sigv4_auth_enabled: true
          serviceAccount:
            create: true
            name: grafana
            annotations:
              # Must match: terraform output -raw amp_query_role_arn
              eks.amazonaws.com/role-arn: arn:aws:iam::626635446574:role/jn-eks-amp-query
          persistence:
            enabled: false
          sidecar:
            datasources:
              # The chart's own auto-provisioned "Prometheus" datasource (pointing at the
              # local agent-mode Prometheus, which has no query API) is also isDefault:true
              # by default — conflicts with the AMP datasource below ("only one default
              # datasource per org"). Disable it; AMP is the only queryable datasource.
              defaultDatasourceEnabled: false
          resources:
            # 256Mi limit OOMKilled Grafana (exit 137) under real browsing load —
            # dashboards + live AMP queries need more than the idle footprint.
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
          additionalDataSources:
            - name: AMP
              # The generic "prometheus" type + manual sigV4Service jsonData works for
              # the legacy /api/datasources/proxy/... path but NOT for Grafana's actual
              # dashboard/Explore query path (backend queryData plugin) — that one still
              # signs with the wrong service and gets "Credential should be scoped to
              # correct service: 'aps'". Use the dedicated AMP plugin instead, which is
              # already bundled in the grafana/grafana image and signs correctly on both
              # paths.
              type: grafana-amazonprometheus-datasource
              access: proxy
              # Must match: terraform output -raw amp_query_endpoint
              url: https://aps-workspaces.us-west-2.amazonaws.com/workspaces/ws-1e1cbec8-5175-4312-a5fe-d79116bfaac5/
              isDefault: true
              jsonData:
                sigV4Auth: true
                sigV4AuthType: default
                sigV4Region: us-west-2

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      # prometheus-operator's CRDs (Prometheus, Alertmanager, etc.) exceed the 262144-byte
      # client-side-apply annotation limit — same class of issue as ArgoCD's own
      # ApplicationSet CRD during initial bootstrap. Server-side apply avoids it.
      - ServerSideApply=true

  revisionHistoryLimit: 6
