apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: autocare
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/jay-nagulavancha/autocare
    targetRevision: HEAD
    path: autocare-infra/k8s/
    # Without recurse, Argo CD only syncs YAML files in the path root (e.g. Namespace,
    # ResourceQuota). Subdirectories (deployments/, services/, …) are ignored, so the UI
    # never picked up new image tags from Git.
    directory:
      recurse: true
      # This manifest updates the Application CR itself; excluding avoids a self-referential sync loop.
      # monitoring-app.yaml is its own separate Application (Helm chart source, not plain manifests) —
      # excluded so the autocare app doesn't try to manage it too.
      exclude: "{argocd/autocare-app.yaml,argocd/monitoring-app.yaml}"

  destination:
    server: https://kubernetes.default.svc
    namespace: autocare

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true

  # How many past Git syncs Argo CD keeps in the UI History / rollback list.
  # Set here (not only in the UI) so automated sync + selfHeal does not revert it.
  revisionHistoryLimit: 6
