# Dedicated internet-facing ALB for Argo CD (separate from autocare-ingress in namespace autocare).
# Requires argocd-server to run with server.insecure=true (see 02-bootstrap-cluster.sh step 2).
# After sync: kubectl get ingress argocd-server-alb -n argocd -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server-alb
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-server-alb
    app.kubernetes.io/part-of: argocd
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
