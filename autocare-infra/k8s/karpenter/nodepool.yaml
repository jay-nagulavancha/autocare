# NodePool — defines *what* nodes Karpenter is allowed to create.
# On-demand only for now (no spot) to keep this first pass simple — the
# interruption queue/EventBridge rules are already wired up in Terraform so
# spot capacity-type can be added later just by extending the requirements
# below, no infra changes needed.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          # Same family already used by the managed node group, plus
          # t3.medium so Karpenter can right-size up instead of only ever
          # picking the smallest option — the actual point of switching.
          values: ["t3.small", "t3.medium"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      # Force periodic replacement so nodes don't run indefinitely on a stale AMI.
      expireAfter: 720h
  limits:
    cpu: "8"
    memory: 16Gi
  disruption:
    # Native scale-to-zero-when-idle — this is what replaces the auto-shutdown
    # Lambda's node-scaling half.
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
