# Dedicated internet-facing ALB for Grafana (separate from autocare-ingress and
# argocd-server-alb). Grafana serves plain HTTP by default, no extra config needed.
# After sync: kubectl get ingress grafana-alb -n monitoring -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-alb
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana-alb
    app.kubernetes.io/part-of: monitoring
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoring-grafana
                port:
                  number: 80
