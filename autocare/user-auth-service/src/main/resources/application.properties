spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:auth_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
autocare.app.jwtSecret=${JWT_SECRET}
autocare.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

autocare.service-id=user-auth-service
autocare.build.version=@project.version@
autocare.build.git-commit=${AUTOCARE_GIT_COMMIT:local}
autocare.build.time=${AUTOCARE_BUILD_TIME:unknown}
